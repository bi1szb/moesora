<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live2D 布局调试器</title>
    <style>
      :root {
        color-scheme: light;
        --theme: #78c83f;
        --ink: #2f2a38;
        --muted: #7d738a;
        --line: #d9eac6;
        --panel: rgba(255, 255, 255, 0.92);
        --soft: #edf9df;
        --stage: #162117;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        font-family:
          "Microsoft YaHei",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--ink);
        background: #f6fbf2;
      }
      aside {
        height: 100vh;
        overflow: auto;
        padding: 16px;
        background: var(--panel);
        border-right: 1px solid var(--line);
        box-shadow: 8px 0 24px rgba(48, 75, 36, 0.08);
        z-index: 2;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 20px;
        line-height: 1.3;
      }
      .hint {
        margin: 0 0 14px;
        font-size: 12px;
        line-height: 1.7;
        color: var(--muted);
      }
      .section {
        margin: 12px 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.72);
      }
      .section-title {
        margin: 0 0 9px;
        font-size: 13px;
        font-weight: 800;
      }
      label {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr) 54px;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
        font-size: 12px;
        color: var(--muted);
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--theme);
      }
      input[type="text"],
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        padding: 8px 10px;
        font: inherit;
        font-size: 12px;
        outline: none;
      }
      input[type="text"]:focus,
      select:focus {
        border-color: var(--theme);
        box-shadow: 0 0 0 2px rgba(120, 200, 63, 0.18);
      }
      output {
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        font-size: 12px;
      }
      .model-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }
      .checks {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }
      .checks label {
        display: flex;
        gap: 8px;
        margin: 0;
        color: var(--ink);
      }
      button {
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--soft);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        padding: 8px 11px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--theme);
        color: #4c9d18;
      }
      .buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .status {
        min-height: 40px;
        margin: 10px 0 0;
        padding: 9px 10px;
        border-radius: 8px;
        background: var(--soft);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
      }
      pre {
        max-height: 170px;
        overflow: auto;
        margin: 0;
        border-radius: 8px;
        background: #24252b;
        color: #e8f6db;
        padding: 10px;
        font-size: 11px;
        line-height: 1.6;
        white-space: pre-wrap;
      }
      main {
        position: relative;
        min-width: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.06) 1px,
            transparent 1px
          ),
          radial-gradient(
            circle at 30% 20%,
            rgba(120, 200, 63, 0.2),
            transparent 28%
          ),
          var(--stage);
        background-size:
          24px 24px,
          24px 24px,
          auto,
          auto;
      }
      .stage-label {
        position: absolute;
        top: 14px;
        right: 16px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.72);
        font-size: 12px;
        pointer-events: none;
      }
      #pet {
        position: absolute;
        left: 0;
        top: 0;
        width: 280px;
        height: 225px;
        outline: 2px solid rgba(255, 82, 110, 0.9);
        background: rgba(255, 82, 110, 0.035);
      }
      #pet.no-frame {
        outline-color: transparent;
        background: transparent;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: 1px dashed rgba(103, 179, 255, 0.9);
        cursor: grab;
      }
      #pet.no-frame #canvas {
        outline-color: transparent;
      }
      #toolbar {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 6px;
        z-index: 5;
        pointer-events: none;
      }
      #toolbar button {
        width: 31px;
        height: 31px;
        padding: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.86);
        color: #77bd33;
        box-shadow: 0 5px 16px rgba(20, 30, 18, 0.22);
        pointer-events: auto;
      }
      @media (max-width: 860px) {
        body {
          grid-template-columns: 1fr;
        }
        aside {
          height: auto;
          max-height: 52vh;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        main {
          min-height: 62vh;
        }
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>Live2D 布局调试器</h1>
      <p class="hint">
        红框是桌宠容器，蓝色虚线是 canvas，粉色 PIXI
        线框是当前模型渲染边界。这里的调整只影响预览，不会改正式桌宠文件。
      </p>

      <div class="section">
        <p class="section-title">模型</p>
        <div class="model-row">
          <input
            id="modelUrl"
            type="text"
            placeholder="粘贴 .model3.json 地址"
          />
          <button id="loadBtn" type="button">加载</button>
        </div>
        <div id="status" class="status">等待加载模型。</div>
      </div>

      <div class="section">
        <p class="section-title">容器</p>
        <label
          >宽度
          <input
            id="cw"
            type="range"
            min="80"
            max="640"
            step="1"
            value="280" /><output id="cwOut"></output
        ></label>
        <label
          >高度
          <input
            id="ch"
            type="range"
            min="80"
            max="520"
            step="1"
            value="225" /><output id="chOut"></output
        ></label>
        <label
          >位置 X
          <input
            id="px"
            type="range"
            min="0"
            max="1000"
            step="1"
            value="0" /><output id="pxOut"></output
        ></label>
        <label
          >位置 Y
          <input
            id="py"
            type="range"
            min="0"
            max="1000"
            step="1"
            value="0" /><output id="pyOut"></output
        ></label>
      </div>

      <div class="section">
        <p class="section-title">模型摆放</p>
        <label
          >缩放
          <input
            id="zoom"
            type="range"
            min=".5"
            max="1.8"
            step=".01"
            value="1.10" /><output id="zoomOut"></output
        ></label>
        <label
          >偏移 X
          <input
            id="mx"
            type="range"
            min="-220"
            max="220"
            step="1"
            value="0" /><output id="mxOut"></output
        ></label>
        <label
          >偏移 Y
          <input
            id="my"
            type="range"
            min="-220"
            max="220"
            step="1"
            value="0" /><output id="myOut"></output
        ></label>
      </div>

      <div class="section">
        <p class="section-title">功能栏</p>
        <label
          >锚点
          <select id="toolAnchor">
            <option value="right">右上</option>
            <option value="left">左上</option></select
          ><output></output
        ></label>
        <label
          >水平距
          <input
            id="tx"
            type="range"
            min="-120"
            max="420"
            step="1"
            value="8" /><output id="txOut"></output
        ></label>
        <label
          >顶部距
          <input
            id="ty"
            type="range"
            min="-120"
            max="320"
            step="1"
            value="8" /><output id="tyOut"></output
        ></label>
      </div>

      <div class="section">
        <p class="section-title">显示</p>
        <div class="checks">
          <label
            ><input id="showFrames" type="checkbox" checked /> 显示容器和 canvas
            边界</label
          >
          <label
            ><input id="showBounds" type="checkbox" checked />
            显示模型渲染边界</label
          >
        </div>
      </div>

      <div class="section">
        <p class="section-title">操作</p>
        <div class="buttons">
          <button id="resetBtn" type="button">恢复默认</button>
          <button id="fitRightBtn" type="button">放到右下</button>
        </div>
      </div>

      <div class="section">
        <p class="section-title">当前参数</p>
        <pre id="codeOut"></pre>
      </div>
    </aside>

    <main id="stage">
      <div class="stage-label">预览区域</div>
      <div id="pet">
        <canvas id="canvas"></canvas>
        <div id="toolbar" aria-label="功能栏预览">
          <button type="button">✦</button>
          <button type="button">⤢</button>
          <button type="button">♪</button>
          <button type="button">↺</button>
          <button type="button">×</button>
        </div>
      </div>
    </main>

    <script src="./live2dcubismcore.min.js"></script>
    <script src="./pixi.min.js"></script>
    <script src="./cubism4.min.js"></script>
    <script>
      (function () {
        "use strict";

        var $ = function (id) {
          return document.getElementById(id);
        };
        var stage = $("stage");
        var pet = $("pet");
        var canvas = $("canvas");
        var toolbar = $("toolbar");
        var status = $("status");
        var codeOut = $("codeOut");

        var controls = {
          cw: $("cw"),
          ch: $("ch"),
          px: $("px"),
          py: $("py"),
          zoom: $("zoom"),
          mx: $("mx"),
          my: $("my"),
          tx: $("tx"),
          ty: $("ty"),
          toolAnchor: $("toolAnchor"),
          showFrames: $("showFrames"),
          showBounds: $("showBounds"),
        };

        var app = null;
        var model = null;
        var debugBox = null;
        var localBounds = null;
        var dragging = null;

        function num(id) {
          return Number(controls[id].value);
        }

        function setStatus(text) {
          status.textContent = text;
        }

        function syncOut(id, suffix) {
          var out = $(id + "Out");
          if (out) out.textContent = controls[id].value + (suffix || "");
        }

        function stageSize() {
          return {
            w: Math.max(1, stage.clientWidth),
            h: Math.max(1, stage.clientHeight),
          };
        }

        function clampPosition() {
          var s = stageSize();
          controls.px.max = Math.max(0, s.w - num("cw"));
          controls.py.max = Math.max(0, s.h - num("ch"));
          controls.px.value = Math.max(
            0,
            Math.min(Number(controls.px.max), num("px")),
          );
          controls.py.value = Math.max(
            0,
            Math.min(Number(controls.py.max), num("py")),
          );
        }

        function placeRightBottom() {
          var s = stageSize();
          controls.px.value = Math.max(0, s.w - num("cw") - 24);
          controls.py.value = Math.max(0, s.h - num("ch") - 24);
        }

        function resetDefaults() {
          controls.cw.value = 280;
          controls.ch.value = 225;
          controls.zoom.value = 1.1;
          controls.mx.value = 0;
          controls.my.value = 0;
          controls.tx.value = 8;
          controls.ty.value = 8;
          controls.toolAnchor.value = "right";
          controls.showFrames.checked = true;
          controls.showBounds.checked = true;
          placeRightBottom();
          update();
        }

        function initPixi() {
          if (app) return;
          try {
            var L2D = PIXI.live2d.Live2DModel;
            if (L2D && L2D.registerTicker && PIXI.Ticker)
              L2D.registerTicker(PIXI.Ticker);
            if (L2D && L2D.registerInteraction && PIXI.InteractionManager)
              L2D.registerInteraction(PIXI.InteractionManager);
          } catch (e) {}

          app = new PIXI.Application({
            view: canvas,
            width: num("cw"),
            height: num("ch"),
            backgroundAlpha: 0,
            antialias: true,
            autoStart: true,
            resolution: Math.max(1, Math.min(3, window.devicePixelRatio || 1)),
            autoDensity: true,
          });
          debugBox = new PIXI.Graphics();
          app.stage.addChild(debugBox);
        }

        function currentLocalBounds() {
          if (!model) return null;
          model.scale.set(1);
          model.x = 0;
          model.y = 0;
          try {
            if (model.getLocalBounds) return model.getLocalBounds();
          } catch (e) {}
          return {
            x: 0,
            y: 0,
            width: model.width || 1,
            height: model.height || 1,
          };
        }

        function placeModel() {
          if (!app) return;
          app.renderer.resize(num("cw"), num("ch"));
          if (!model) {
            drawBounds();
            return;
          }

          var b = localBounds || currentLocalBounds();
          if (!b || !b.width || !b.height) return;

          var fit =
            Math.min(num("cw") / b.width, num("ch") / b.height) *
            0.985 *
            num("zoom");
          model.scale.set(fit);
          var sw = b.width * fit;
          var sh = b.height * fit;
          model.x = (num("cw") - sw) / 2 - b.x * fit + num("mx");
          model.y = num("ch") - sh - b.y * fit + num("my");
          drawBounds();
        }

        function drawBounds() {
          if (!debugBox) return;
          debugBox.clear();
          if (!model || !controls.showBounds.checked) return;
          var b = model.getBounds();
          debugBox.lineStyle(2, 0xff4466, 1);
          debugBox.drawRect(b.x, b.y, b.width, b.height);
        }

        function updateCode() {
          var lines = [
            "BASE_W = " + num("cw"),
            "BASE_H = " + num("ch"),
            "MODEL_ZOOM = " + num("zoom").toFixed(2),
            "MODEL_OFFSET_X = " + num("mx") + "px",
            "MODEL_OFFSET_Y = " + num("my") + "px",
            "TOOLBAR_" +
              controls.toolAnchor.value.toUpperCase() +
              " = " +
              num("tx") +
              "px",
            "TOOLBAR_TOP = " + num("ty") + "px",
          ];
          if (localBounds) {
            lines.push("");
            lines.push(
              "localBounds = " +
                [
                  Math.round(localBounds.x * 100) / 100,
                  Math.round(localBounds.y * 100) / 100,
                  Math.round(localBounds.width * 100) / 100,
                  Math.round(localBounds.height * 100) / 100,
                ].join(", "),
            );
          }
          codeOut.textContent = lines.join("\n");
        }

        function updateToolbar() {
          toolbar.style.top = num("ty") + "px";
          if (controls.toolAnchor.value === "left") {
            toolbar.style.left = num("tx") + "px";
            toolbar.style.right = "auto";
          } else {
            toolbar.style.right = num("tx") + "px";
            toolbar.style.left = "auto";
          }
        }

        function update() {
          clampPosition();
          pet.style.width = num("cw") + "px";
          pet.style.height = num("ch") + "px";
          pet.style.left = num("px") + "px";
          pet.style.top = num("py") + "px";
          pet.classList.toggle("no-frame", !controls.showFrames.checked);
          updateToolbar();
          syncOut("cw", "px");
          syncOut("ch", "px");
          syncOut("px", "px");
          syncOut("py", "px");
          syncOut("zoom", "x");
          syncOut("mx", "px");
          syncOut("my", "px");
          syncOut("tx", "px");
          syncOut("ty", "px");
          placeModel();
          updateCode();
        }

        async function loadModel() {
          initPixi();
          var input = $("modelUrl");
          var url = input.value.trim();
          if (!url) {
            setStatus("请先填写 .model3.json 地址。");
            return;
          }
          try {
            localStorage.setItem("moe-l2d-tuner-url", url);
          } catch (e) {}
          setStatus("正在加载模型...");
          try {
            if (model) {
              app.stage.removeChild(model);
              try {
                model.destroy();
              } catch (e) {}
            }
            model = await PIXI.live2d.Live2DModel.from(url, {
              autoInteract: false,
            });
            app.stage.addChildAt(model, 0);
            localBounds = currentLocalBounds();
            setStatus(
              "加载成功\n原始 width/height: " +
                Math.round(model.width) +
                " x " +
                Math.round(model.height) +
                "\nlocalBounds: " +
                Math.round(localBounds.width) +
                " x " +
                Math.round(localBounds.height),
            );
            update();
          } catch (error) {
            console.error(error);
            setStatus(
              "加载失败：" + (error && error.message ? error.message : error),
            );
          }
        }

        function bind() {
          Object.keys(controls).forEach(function (key) {
            var el = controls[key];
            var event =
              el.type === "checkbox" || el.tagName === "SELECT"
                ? "change"
                : "input";
            el.addEventListener(event, update);
          });
          $("loadBtn").addEventListener("click", loadModel);
          $("resetBtn").addEventListener("click", resetDefaults);
          $("fitRightBtn").addEventListener("click", function () {
            placeRightBottom();
            update();
          });
          window.addEventListener("resize", update);

          pet.addEventListener("pointerdown", function (event) {
            if (event.button !== undefined && event.button !== 0) return;
            dragging = {
              pointerId: event.pointerId,
              sx: event.clientX,
              sy: event.clientY,
              x: num("px"),
              y: num("py"),
            };
            try {
              pet.setPointerCapture(event.pointerId);
            } catch (e) {}
          });
          pet.addEventListener("pointermove", function (event) {
            if (!dragging || dragging.pointerId !== event.pointerId) return;
            controls.px.value = dragging.x + event.clientX - dragging.sx;
            controls.py.value = dragging.y + event.clientY - dragging.sy;
            update();
          });
          function stopDrag(event) {
            if (
              !dragging ||
              (event.pointerId !== undefined &&
                dragging.pointerId !== event.pointerId)
            )
              return;
            dragging = null;
          }
          pet.addEventListener("pointerup", stopDrag);
          pet.addEventListener("pointercancel", stopDrag);
        }

        function boot() {
          try {
            var saved = localStorage.getItem("moe-l2d-tuner-url");
            if (saved) $("modelUrl").value = saved;
          } catch (e) {}
          bind();
          initPixi();
          resetDefaults();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
      })();
    </script>
  </body>
</html>
